
name: Build Fire Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Fire Client Source
        run: |
          unzip -o Fire-Client-v1.0-source.zip -d /tmp/fireclient
          cp -a /tmp/fireclient/FireClient_v1/. .

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fireclient/app/MainActivity.kt

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK Output
        run: |
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload Fire Client APK
        uses: actions/upload-artifact@v4
        with:
          name: Fire-Client-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
